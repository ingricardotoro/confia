# Catalog of the title and the detail of every Problem Details response of the web edge, in the
# Spanish of Honduras, UTF-8 (web-edge-foundations design.md, decision 10). It is the single source
# of these texts: no message of this kind is written in a class. Every key is problem.<code>.title
# or problem.<code>.detail, where <code> is a ProblemCode; ProblemCatalogCoverageTest fails naming
# any code without an entry and any entry without a code.
#
# The texts say what happened to the request and what the person can do. They never name a class,
# a table, a route or a rejected value, and they are the same whatever Accept-Language says.

problem.validation-failed.title=La solicitud no es válida
problem.validation-failed.detail=La solicitud contiene datos que no se pueden procesar. Revise la información enviada e inténtelo de nuevo.

problem.idempotency-key-missing.title=Falta la clave de idempotencia
problem.idempotency-key-missing.detail=Esta operación mueve dinero y exige la cabecera Idempotency-Key con un valor único por intento. Agréguela e inténtelo de nuevo.

problem.authentication-required.title=Se requiere autenticación
problem.authentication-required.detail=Debe iniciar sesión para realizar esta operación.

problem.forbidden.title=Acceso denegado
problem.forbidden.detail=No tiene permiso para realizar esta operación.

problem.resource-not-found.title=Recurso no encontrado
problem.resource-not-found.detail=El recurso solicitado no existe.

problem.method-not-allowed.title=Método no permitido
problem.method-not-allowed.detail=Este método no está permitido para la operación solicitada.

problem.idempotency-conflict.title=Operación en curso
problem.idempotency-conflict.detail=Ya hay una solicitud en curso con la misma clave de idempotencia. Espere a que termine y repita la solicitud con la misma clave para obtener su resultado.

problem.unsupported-media-type.title=Formato no admitido
problem.unsupported-media-type.detail=La operación no admite el formato de los datos enviados. Envíelos en un formato admitido e inténtelo de nuevo.

problem.idempotency-payload-mismatch.title=Clave de idempotencia ya usada con otros datos
problem.idempotency-payload-mismatch.detail=La clave de idempotencia ya se usó con datos distintos. Use una clave nueva para una operación nueva, o repita la solicitud original sin cambios.

problem.internal-error.title=Error interno
problem.internal-error.detail=Ocurrió un error inesperado. Si el problema continúa, comuníquese con soporte e indique el identificador de la solicitud.

problem.too-many-requests.title=Demasiadas solicitudes
problem.too-many-requests.detail=Se realizaron demasiadas solicitudes en poco tiempo. Espere el tiempo indicado en la cabecera Retry-After e inténtelo de nuevo.

problem.capacity-exceeded.title=Servicio temporalmente no disponible
problem.capacity-exceeded.detail=El servicio no puede atender la solicitud en este momento. Inténtelo de nuevo más tarde.

problem.token-invalid.title=Credencial no válida
problem.token-invalid.detail=La credencial de acceso no es válida o la sesión ya terminó. Inicie sesión de nuevo.

problem.token-expired.title=Credencial vencida
problem.token-expired.detail=La credencial de acceso venció. Renueve la sesión o inicie sesión de nuevo.

problem.csrf-invalid.title=Solicitud no autorizada
problem.csrf-invalid.detail=La solicitud no se pudo verificar como originada en la aplicación. Recargue la página e inténtelo de nuevo.

problem.authentication-failed.title=Credenciales inválidas
problem.authentication-failed.detail=El identificador o la contraseña no son correctos. Revíselos e inténtelo de nuevo.

problem.second-factor-invalid.title=Código de verificación no válido
problem.second-factor-invalid.detail=El código ingresado no es válido o ya se usó. Ingrese el código actual de su aplicación de autenticación o un código de recuperación.

problem.mfa-already-enrolled.title=El segundo factor ya está configurado
problem.mfa-already-enrolled.detail=La cuenta ya tiene un segundo factor activo. Inicie sesión con el código de su aplicación de autenticación.

problem.session-expired.title=La sesión terminó
problem.session-expired.detail=Su sesión terminó o ya no es válida. Inicie sesión de nuevo.

problem.academic-year-overlap.title=Las fechas se solapan con otro año lectivo
problem.academic-year-overlap.detail=El rango de fechas comparte al menos un día con otro año lectivo de la institución. Ajuste la fecha de inicio o de fin e inténtelo de nuevo.

problem.academic-year-already-active.title=Ya existe un año lectivo activo
problem.academic-year-already-active.detail=La institución ya tiene un año lectivo activo y solo puede haber uno. Cierre el año activo antes de activar otro.

problem.academic-year-closed.title=El año lectivo está cerrado
problem.academic-year-closed.detail=Un año lectivo cerrado no se puede editar ni reabrir, y no admite nuevas secciones.

problem.duplicate-name.title=Ya existe un registro igual
problem.duplicate-name.detail=Ya existe un registro con el mismo nombre, código u orden en este ámbito. Use un valor distinto e inténtelo de nuevo.

problem.duplicate-payment-concept-code.title=El código del concepto de pago ya existe
problem.duplicate-payment-concept-code.detail=Ya existe un concepto de pago con ese código en la institución, sin distinguir mayúsculas de minúsculas. Use un código distinto.

problem.inactive-reference.title=El registro referenciado está inactivo
problem.inactive-reference.detail=La modalidad, el grado, la sección, el concepto de pago o la tasa de impuesto seleccionado está inactivo. Elija uno activo o actívelo primero.

problem.price-validity-overlap.title=La vigencia del precio se solapa con otra
problem.price-validity-overlap.detail=Ya existe un precio de este concepto en la lista cuya vigencia coincide en alguno de los días indicados. Ajuste las fechas de inicio y fin; solo se reemplaza por sí sola la vigencia abierta anterior a la nueva fecha de inicio.

problem.price-list-archived.title=La lista de precios está archivada
problem.price-list-archived.detail=Una lista de precios archivada no admite precios nuevos. Active la lista o use otra.

problem.duplicate-tax-rate-code.title=El código de la tasa de impuesto ya existe
problem.duplicate-tax-rate-code.detail=Ya existe una tasa de impuesto con ese código en la institución, sin distinguir mayúsculas de minúsculas. Use un código distinto.

problem.tax-rate-period-overlap.title=La vigencia de la tasa se solapa con otra
problem.tax-rate-period-overlap.detail=Ya existe una vigencia de esta tasa que coincide en alguno de los días indicados. Ajuste las fechas de inicio y fin; solo se reemplaza por sí sola la vigencia abierta anterior a la nueva fecha de inicio.

problem.plan-not-editable.title=El estado del plan de cobro no permite este cambio
problem.plan-not-editable.detail=Solo un plan en borrador admite agregar o quitar conceptos y cambiar su periodicidad o su día de vencimiento. Un plan activo solo cambia de nombre y puede archivarse; un plan archivado no cambia y no se reactiva. Para cambiar un plan activo cree otro.

problem.plan-without-items.title=El plan de cobro no tiene conceptos
problem.plan-without-items.detail=Un plan de cobro necesita al menos un concepto para activarse. Agregue un concepto y vuelva a intentarlo.
problem.plan-item-invalid.title=El concepto del plan de cobro no admite esos periodos
problem.plan-item-invalid.detail=Un plan de cobro de pago unico genera exactamente un periodo por concepto. Corrija el concepto del plan o cree otro plan.
problem.accrual-run-in-progress.title=Ya hay una generacion de cargos en curso
problem.accrual-run-in-progress.detail=Hay otra generacion de cargos de este plan y de este periodo en cola o en ejecucion. Espere a que termine antes de pedir otra.
problem.charge-already-voided.title=El cargo ya fue anulado
problem.charge-already-voided.detail=Un cargo se anula una sola vez. Si hace falta cobrar de nuevo, emita un cargo manual.
problem.charge-not-voidable.title=No se pudo anular el cargo
problem.charge-not-voidable.detail=El libro mayor no acepta el reverso de este cargo, por ejemplo porque la cuenta del estudiante esta en revision. No se escribio nada; consulte a un administrador.

problem.duplicate-plan-item.title=El concepto ya está en el plan de cobro
problem.duplicate-plan-item.detail=Un concepto aparece una sola vez por plan de cobro. Quite el renglón existente si necesita cambiar sus períodos o su fecha de inicio.

problem.duplicate-account-code.title=El código de cuenta ya existe
problem.duplicate-account-code.detail=La institución ya tiene una cuenta con ese código, sin distinguir mayúsculas. Use otro código o edite la cuenta existente.

problem.account-in-use.title=La cuenta está en uso y no se puede desactivar
problem.account-in-use.detail=El mapa de contabilización de los cargos apunta a esta cuenta. Cambie primero el mapa a otra cuenta y vuelva a intentarlo.

problem.posting-account-invalid.title=La cuenta no sirve para ese uso contable
problem.posting-account-invalid.detail=La cuenta por cobrar debe ser de activo y llevar el saldo de cada estudiante; el ingreso, de ingresos; y el impuesto por pagar, de pasivo; estos dos sin saldos de estudiantes. Elija otra cuenta del plan de cuentas.

problem.stale-version.title=El registro cambió desde que lo leyó
problem.stale-version.detail=Otra persona modificó este registro después de que usted lo consultó. Recargue los datos actuales y vuelva a aplicar su cambio.

problem.duplicate-student-code.title=El código de estudiante ya existe
problem.duplicate-student-code.detail=Ya existe un estudiante con ese código en la institución. Use un código distinto o déjelo vacío para que el sistema genere uno.

problem.duplicate-national-id.title=El documento de identidad ya está registrado
problem.duplicate-national-id.detail=Ya existe un registro de este tipo en la institución con ese documento de identidad. Revise el número ingresado.

problem.student-not-active.title=El estudiante no está activo
problem.student-not-active.detail=Solo se puede matricular a un estudiante activo, o cambiar sus encargados. Active al estudiante antes de continuar.

problem.section-full.title=La sección no tiene cupo
problem.section-full.detail=La sección ya tiene tantas matrículas activas como su cupo. Elija otra sección o aumente el cupo de esta.

problem.duplicate-active-enrollment.title=El estudiante ya está matriculado en el año lectivo
problem.duplicate-active-enrollment.detail=El estudiante ya tiene una matrícula activa en este año lectivo. Registre su salida o trasládelo de sección en lugar de matricularlo de nuevo.

problem.invalid-enrollment-state.title=La matrícula no admite esa operación
problem.invalid-enrollment-state.detail=Solo una matrícula activa se traslada o se da de baja. Retiro, traslado a otra institución y graduación son estados finales.

problem.transfer-year-mismatch.title=La sección pertenece a otro año lectivo
problem.transfer-year-mismatch.detail=El traslado de sección ocurre dentro del mismo año lectivo de la matrícula. Elija una sección de ese año.

problem.invalid-responsibility-split.title=El reparto de responsabilidad no es válido
problem.invalid-responsibility-split.detail=Los encargados del estudiante deben sumar exactamente 100 %, sin repetir encargado y con un solo pagador principal y un solo destinatario de factura. Revise los porcentajes e inténtelo de nuevo.

problem.guardian-not-active.title=El encargado no está activo
problem.guardian-not-active.detail=Solo se puede vincular a un estudiante, o registrar un consentimiento de comunicaciones, a un encargado activo. Active al encargado o quítelo del reparto. Revocar un consentimiento siempre es posible.

problem.consent-channel-unavailable.title=El encargado no tiene el dato de contacto de ese canal
problem.consent-channel-unavailable.detail=Para registrar un consentimiento por correo el encargado necesita un correo, y por SMS o WhatsApp un teléfono. Registre el dato en el encargado e inténtelo de nuevo.

problem.import-not-simulated.title=El archivo no fue simulado
problem.import-not-simulated.detail=Solo se puede aplicar un archivo que usted ya simuló con esta cuenta. Simule el archivo, revise el reporte de rechazos y luego aplíquelo.

problem.import-file-changed.title=El archivo cambió desde la simulación
problem.import-file-changed.detail=El archivo que intenta aplicar no es el que simuló por última vez. Simúlelo de nuevo y aplique ese mismo archivo, sin modificarlo entre un paso y el otro.
