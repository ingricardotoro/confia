# Catalog of the title and the detail of every Problem Details response of the web edge, in the
# Spanish of Honduras, UTF-8 (web-edge-foundations design.md, decision 10). It is the single source
# of these texts: no message of this kind is written in a class. Every key is problem.<code>.title
# or problem.<code>.detail, where <code> is a ProblemCode; ProblemCatalogCoverageTest fails naming
# any code without an entry and any entry without a code.
#
# The texts say what happened to the request and what the person can do. They never name a class,
# a table, a route or a rejected value, and they are the same whatever Accept-Language says.

problem.validation-failed.title=La solicitud no es válida
problem.validation-failed.detail=La solicitud contiene datos que no se pueden procesar. Revise la información enviada e inténtelo de nuevo.

problem.idempotency-key-missing.title=Falta la clave de idempotencia
problem.idempotency-key-missing.detail=Esta operación mueve dinero y exige la cabecera Idempotency-Key con un valor único por intento. Agréguela e inténtelo de nuevo.

problem.authentication-required.title=Se requiere autenticación
problem.authentication-required.detail=Debe iniciar sesión para realizar esta operación.

problem.forbidden.title=Acceso denegado
problem.forbidden.detail=No tiene permiso para realizar esta operación.

problem.resource-not-found.title=Recurso no encontrado
problem.resource-not-found.detail=El recurso solicitado no existe.

problem.method-not-allowed.title=Método no permitido
problem.method-not-allowed.detail=Este método no está permitido para la operación solicitada.

problem.idempotency-conflict.title=Operación en curso
problem.idempotency-conflict.detail=Ya hay una solicitud en curso con la misma clave de idempotencia. Espere a que termine y repita la solicitud con la misma clave para obtener su resultado.

problem.unsupported-media-type.title=Formato no admitido
problem.unsupported-media-type.detail=La operación no admite el formato de los datos enviados. Envíelos en un formato admitido e inténtelo de nuevo.

problem.idempotency-payload-mismatch.title=Clave de idempotencia ya usada con otros datos
problem.idempotency-payload-mismatch.detail=La clave de idempotencia ya se usó con datos distintos. Use una clave nueva para una operación nueva, o repita la solicitud original sin cambios.

problem.internal-error.title=Error interno
problem.internal-error.detail=Ocurrió un error inesperado. Si el problema continúa, comuníquese con soporte e indique el identificador de la solicitud.

problem.too-many-requests.title=Demasiadas solicitudes
problem.too-many-requests.detail=Se realizaron demasiadas solicitudes en poco tiempo. Espere el tiempo indicado en la cabecera Retry-After e inténtelo de nuevo.

problem.capacity-exceeded.title=Servicio temporalmente no disponible
problem.capacity-exceeded.detail=El servicio no puede atender la solicitud en este momento. Inténtelo de nuevo más tarde.

problem.token-invalid.title=Credencial no válida
problem.token-invalid.detail=La credencial de acceso no es válida o la sesión ya terminó. Inicie sesión de nuevo.

problem.token-expired.title=Credencial vencida
problem.token-expired.detail=La credencial de acceso venció. Renueve la sesión o inicie sesión de nuevo.

problem.csrf-invalid.title=Solicitud no autorizada
problem.csrf-invalid.detail=La solicitud no se pudo verificar como originada en la aplicación. Recargue la página e inténtelo de nuevo.

problem.authentication-failed.title=Credenciales inválidas
problem.authentication-failed.detail=El identificador o la contraseña no son correctos. Revíselos e inténtelo de nuevo.

problem.second-factor-invalid.title=Código de verificación no válido
problem.second-factor-invalid.detail=El código ingresado no es válido o ya se usó. Ingrese el código actual de su aplicación de autenticación o un código de recuperación.

problem.mfa-already-enrolled.title=El segundo factor ya está configurado
problem.mfa-already-enrolled.detail=La cuenta ya tiene un segundo factor activo. Inicie sesión con el código de su aplicación de autenticación.

problem.session-expired.title=La sesión terminó
problem.session-expired.detail=Su sesión terminó o ya no es válida. Inicie sesión de nuevo.
