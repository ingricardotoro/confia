# Catalog of the title and the detail of every Problem Details response of the web edge, in the
# Spanish of Honduras, UTF-8 (web-edge-foundations design.md, decision 10). It is the single source
# of these texts: no message of this kind is written in a class. Every key is problem.<code>.title
# or problem.<code>.detail, where <code> is a ProblemCode; ProblemCatalogCoverageTest fails naming
# any code without an entry and any entry without a code.
#
# The texts say what happened to the request and what the person can do. They never name a class,
# a table, a route or a rejected value, and they are the same whatever Accept-Language says.

problem.validation-failed.title=La solicitud no es válida
problem.validation-failed.detail=La solicitud contiene datos que no se pueden procesar. Revise la información enviada e inténtelo de nuevo.

problem.authentication-required.title=Se requiere autenticación
problem.authentication-required.detail=Debe iniciar sesión para realizar esta operación.

problem.forbidden.title=Acceso denegado
problem.forbidden.detail=No tiene permiso para realizar esta operación.

problem.method-not-allowed.title=Método no permitido
problem.method-not-allowed.detail=Este método no está permitido para la operación solicitada.

problem.internal-error.title=Error interno
problem.internal-error.detail=Ocurrió un error inesperado. Si el problema continúa, comuníquese con soporte e indique el identificador de la solicitud.
