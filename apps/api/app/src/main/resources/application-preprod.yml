# SPRING_PROFILES_ACTIVE=preprod (docs/05-infraestructura-y-despliegue.md): the only profiles, with
# local, where the OpenAPI document endpoint and Swagger UI answer (docs/01-arquitectura.md §7;
# frontend-monorepo-and-contracts-pipeline, design.md decision 3). Production never sets this.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
