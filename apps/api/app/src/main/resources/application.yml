# Default configuration for the three real entry points (admin, portal, worker). Flyway never runs
# here: migrating is a separate concern of the "migrate" profile
# (docs/05-infraestructura-y-despliegue.md; application-migrate.yml).
server:
  # Never let the container rewrite the remote address from X-Forwarded-For on its own. Without
  # this line Spring Boot switches the native strategy on when it detects a cloud platform (for
  # example Kubernetes) and Tomcat then trusts its own private ranges, which would defeat the
  # trusted-proxy list that RequestContextFilter applies (web-edge-foundations design.md, decision
  # 12).
  forward-headers-strategy: none
  # Bounds on what a client can hold open (web-edge-foundations design.md, decision 18). The header
  # size doubles Spring Boot's 8KB default to admit long tokens; it is the one ceiling on the request
  # line and all headers together, X-Forwarded-For included, which has no cap of its own.
  max-http-request-header-size: 16KB
  tomcat:
    # Reading the request: a client that sends it too slowly is cut off.
    connection-timeout: 10s
    # How long an idle connection is kept for the next request, and how many it may carry.
    keep-alive-timeout: 20s
    max-keep-alive-requests: 100

confia:
  web:
    # How many characters of the User-Agent header the request origin keeps. The list of trusted
    # proxies is deliberately not set in any file of the repository: it is empty unless the
    # environment sets it (CONFIA_WEB_TRUSTEDPROXIES), so by default no client can choose its own
    # address.
    user-agent-max-length: 512

    # The three rate-limit policies of the administrative process (session-endpoints-cookie-and-csrf
    # design.md, decision 7; web-edge-foundations design.md, decision 17). The defaults live here and
    # not in annotations because three components of the same type need three sets of values. Layer 1
    # counts requests per client address; layer 2 counts failures: once the threshold is crossed the
    # client is admitted one attempt per restricted-interval, never for longer than restriction-cap.
    # A component that is absent, or one that is not one of these three, stops the start.
    rate-limit:
      admin-login:
        request-limit: 10
        request-window: 1m
        failure-threshold: 10
        failure-window: 10m
        restricted-interval: 1m
        restriction-cap: 1h
        max-entries: 50000
      admin-mfa:
        request-limit: 20
        request-window: 1m
        failure-threshold: 10
        failure-window: 10m
        restricted-interval: 1m
        restriction-cap: 1h
        max-entries: 50000
      admin-session:
        request-limit: 120
        request-window: 1m
        failure-threshold: 30
        failure-window: 10m
        restricted-interval: 1m
        restriction-cap: 1h
        max-entries: 50000

    delay:
      # The longest the answer of an authentication route is held back for its required delay
      # (session-endpoints-cookie-and-csrf design.md, decision 8). It stays below the time at which
      # the proxy in front of the process cuts a connection; the delay the policy computed is
      # counted and audited whole, only this wait is capped. Positive and at most 60s.
      max-wait: 30s

  # The audit of the denials by permission (rbac-permission-matrix-and-audit-integration design.md
  # D10). Per account, permission and window, the first max-full-rows denials are written as full audit
  # rows and the rest are counted into one summary when the window closes. max-tracked-keys bounds the
  # windows held in memory; a new key beyond it is written as a full row and counted as untracked. The
  # cap is per process. None of these values is a secret.
  authorization:
    denials:
      max-full-rows: 10
      window: 5m
      max-tracked-keys: 10000

# The executor of the worker process (background-jobs-with-db-scheduler design.md decision 1; ADR-0016).
# These keys are read only by the worker: the administrative and portal entry points exclude the whole
# db-scheduler auto-configuration, so here they are inert. confia.jobs.executor.autostart is never set
# in a versioned file (JobsConfigurationGuardTest); confia.jobs.institutions comes from the
# environment (CONFIA_JOBS_INSTITUTIONS) and has no default on purpose.
db-scheduler:
  # Volume of one institution; leaves room in the default connection pool (10).
  threads: 4
  # The longest a due task waits to be picked.
  polling-interval: 10s
  # A dead execution is noticed after missed-heartbeats-limit heartbeats, about six minutes, below
  # the 900 s goal of the QueueStalled alert.
  heartbeat-interval: 1m
  # Tolerates a long garbage-collection pause without reviving a live execution.
  missed-heartbeats-limit: 6
  # The library default is 30 minutes, which would hold a container stop and every test.
  shutdown-max-wait: 30s
  # No task runs before the context is complete.
  delay-startup-until-context-ready: true

spring:
  main:
    # The worker has no web server, so without this the JVM would end when main returns (probe P-10;
    # WorkerStaysAliveTest). Inert in the web processes, whose server threads keep them alive.
    keep-alive: true
  jackson:
    deserialization:
      # A JSON property the body does not declare is refused with 400 validation-failed and is never
      # ignored (session-endpoints-cookie-and-csrf design.md, decision 9; probe S-5: Spring Boot 4.1.1
      # ignores it by default). A client that sends an extra field is either wrong or probing, and a
      # silent ignore would hide a field a future endpoint starts to read.
      fail-on-unknown-properties: true
  threads:
    virtual:
      # Every request runs on a virtual thread, so the required delay of an answer waits without
      # holding a thread of the server's pool (web-edge-foundations design.md, decision 18, probe
      # P3). The delay materializer refuses to start with this off.
      enabled: true
  mvc:
    # Never log request parameters or headers at DEBUG (web-edge-foundations design.md, decision
    # 22; CLAUDE.md regla 11). Spring Boot already defaults this to false; it is explicit so that
    # turning it on is a visible edit that a test refuses.
    log-request-details: false
  datasource:
    hikari:
      # -1 never fails the context at startup when the database is down: the pool connects on first
      # use. All three processes have a DataSource (the portal since task 2.6 of
      # background-jobs-with-db-scheduler, decision 14), so none of them fails to start with the database down.
      initialization-fail-timeout: -1
      # How long a request waits for a connection. The default (30 s) would make the readiness probe
      # hang past its window with PostgreSQL down instead of answering 503 (dockerfiles-and-local-compose
      # design.md decision 5; CR10). Milliseconds: the pool property is a long, not a duration.
      connection-timeout: 5000
  web:
    resources:
      # No static resource handler: without a mapping for /** the route map of a process holds only
      # what a controller or springdoc registers, so "no production route" is true and checkable
      # (web-edge-foundations design.md, decision 5). Swagger UI is served by springdoc's own
      # resource handler, not by this one; the exposure test on the local profile proves it.
      add-mappings: false
  flyway:
    enabled: false
  jooq:
    # NOTE: this property is inert. Spring Boot's own jOOQ autoconfiguration, which used to read
    # spring.jooq.*, does not exist in Spring Boot 4.1.1 (verified: zero classes under
    # org/springframework/boot/autoconfigure/jooq/ in spring-boot-autoconfigure-4.1.1.jar;
    # apply-progress.md task 1.1, S1.6). A DSLContext is declared explicitly wherever it is needed:
    # the administrative process declares its own in SharedPlatformConfiguration
    # (com.confia.shared.platform.infrastructure, with SQLDialect.POSTGRES in code) and tests use
    # com.confia.support.IntegrationTestApplication. This key remains inert: it is kept, not
    # dropped, so the intended dialect stays discoverable next to the rest of the datasource
    # configuration; nothing reads it.
    sql-dialect: POSTGRES

# Health probes and nothing else (dockerfiles-and-local-compose design.md decision 4; probes P-1 and
# P-2). Actuator is present only as the health module: no metrics, no MeterRegistry, no /actuator/**.
# With the management port at -1 no management context exists, so the only routes are the two probe
# routes, served on the main port with exact patterns (GET /health/live and GET /health/ready), which is
# what PublicEndpoints lists and PublicRouteAllowListTest compares. An additional path takes one segment
# only (probe P-2), so the groups declare /live and /ready and HealthProbeRoutesConfiguration serves them
# under /health; the framework's own mapping of the additional paths is excluded in the web entry points.
# The bodies carry only the status: no components and no details, for any caller (CR09 to CR11).
management:
  server:
    port: -1
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/live"
        readiness:
          include: readinessState, db
          additional-path: "server:/ready"
  health:
    defaults:
      # No disk space, SSL or other default contributor: the readiness group is the application state
      # and the database, and nothing else (CR12).
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

# OpenAPI (docs/01-arquitectura.md §7; frontend-monorepo-and-contracts-pipeline, design.md decision
# 3). Off by default: only application-local.yml and application-preprod.yml turn the document
# endpoint and Swagger UI on, so a new profile or a typo in SPRING_PROFILES_ACTIVE leaves them
# closed rather than open. The document is OpenAPI 3.1 regardless of profile.
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
  # The contract holds only the responses each operation declares with @ApiResponse. With this on,
  # springdoc adds to every operation the responses of the @ExceptionHandler methods of the global
  # translator that carry a status of their own, so a new handler would put a response nobody
  # approved in the snapshot (session-tokens-and-web-layer design.md decision 13; probe S-4).
  override-with-generic-response: false
  # Explicit: health never enters the OpenAPI snapshots (dockerfiles-and-local-compose design.md 4.2).
  show-actuator: false
