# SPRING_PROFILES_ACTIVE=local (docs/05-infraestructura-y-despliegue.md): the only profiles, with
# preprod, where the OpenAPI document endpoint and Swagger UI answer (docs/01-arquitectura.md §7;
# frontend-monorepo-and-contracts-pipeline, design.md decision 3). Production never sets this.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

confia:
  web:
    # The origin of the Vite dev server, the one the CSRF and Origin filter of the administrative
    # chain accepts locally. No other file of the repository sets an allowed origin: every other
    # environment sets CONFIA_WEB_ALLOWEDORIGINS, and with it empty no unsafe request passes
    # (session-endpoints-cookie-and-csrf design.md, decision 4).
    allowed-origins: http://localhost:5173
