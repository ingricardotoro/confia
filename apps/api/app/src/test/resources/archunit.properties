# ArchUnit configuration for apps/api/app (docs/06 §14.1, design.md decision 3, ADR-0018).
#
# ADR-0018 requires this value to be true, explicit, so that a future change back to false is
# visible in the diff instead of an omission. A global false was tried in this change and rejected
# by ADR-0018: it would silently cover every future rule's empty-set safety net, not just today's.
# The one legitimate exception (no business module exists yet under apps/api/app) is declared
# per-rule with allowEmptyShould(true), cited to ADR-0018 next to the rule that needs it, never
# here. com.confia.architecture.SuppressionCitesAdrTest fails the build if this line ever reads
# false again.
archRule.failOnEmptyShould=true
