# ArchUnit configuration for apps/api/app (docs/06 §14.1, design.md decision 3, "por confirmar" #3).
#
# archRule.failOnEmptyShould defaults to true in ArchUnit: a rule applied to zero classes fails
# the build. That default is wrong for this change on purpose: no business module exists yet, so
# every "applies to production code" half of an architecture rule (task 3.4) runs against an
# empty set today and must vacuously pass. The other half of each rule always runs against the
# permanent fixture package (com.confia.architecture.fixture, never empty), which is what actually
# proves the rule works. Once change 4 adds the first business module, the production half starts
# checking real classes without any change needed here.
archRule.failOnEmptyShould=false
