# Single source of truth for the PostgreSQL image used across the build (ADR-0015 rule 1;
# design.md decision 3). Filtered by maven-resources-plugin from apps/api/pom.xml's
# confia.postgres.image property; filtering is restricted to this one file (app/pom.xml
# <includes>) so no ${...} placeholder in an SQL script under src/test/resources gets substituted
# by accident. PostgresImageSingleSourceTest (task 1.6) fails loudly if this value is ever
# literally "${confia.postgres.image}" instead of the real, filtered image tag.
postgres.image=${confia.postgres.image}
