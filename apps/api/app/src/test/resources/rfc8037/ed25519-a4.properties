# RFC 8037, Appendix A.4 "Ed25519 Signing" (https://www.rfc-editor.org/rfc/rfc8037#appendix-A.4),
# with the public key of Appendix A.2 (the same key pair as A.1).
#
# Only the PUBLIC key, the signing input and the PUBLISHED signature are versioned. The private key of
# the appendix is deliberately NOT in the repository (CLAUDE.md, regla 13, without exceptions; owner
# decision of 2026-10-06): every other signature in the tests comes from a key pair generated at run
# time with KeyPairGenerator.getInstance("Ed25519").
#
# All three values are base64url without padding, exactly as the RFC prints them. Being published test
# vectors, none of them is a secret.

# Appendix A.2, "x": the 32 raw bytes of the Ed25519 public key.
publicKey=11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo

# Appendix A.4: BASE64URL(protected header {"alg":"EdDSA"}) "." BASE64URL(payload "Example of Ed25519 signing").
signingInput=eyJhbGciOiJFZERTQSJ9.RXhhbXBsZSBvZiBFZDI1NTE5IHNpZ25pbmc

# Appendix A.4: the 64-byte signature of the signing input.
signature=hgyY0il_MGCjP0JzlnLWG1PPOt7-09PGcvMg3AIbQR6dWbhijcNR4ki4iylGjg5BhVsPt9g7sVvpAr_MuM0KAg
