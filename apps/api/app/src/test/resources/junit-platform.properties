# jqwik configuration for apps/api/app (design.md, "Cambios de archivos"; task 1.9).
# jqwik.database persists failing seeds across runs so a property failure is reproducible; pointed
# inside target/ (already git-ignored), same as kernel, so a failing run never leaves an untracked
# file at the module root.
jqwik.database=target/jqwik-database
# Lower than kernel's 1000 (apps/api/kernel/src/test/resources/junit-platform.properties): this
# module's property test (CanonicalSerializationCrossCheckIT, PR B3a) round-trips to a real
# PostgreSQL container on every try, unlike kernel's pure in-memory properties. 1000 tries at even a
# few milliseconds of real JDBC latency each would risk the 8-minute *IT.java suite budget
# (design.md §13); 100 stays well inside it while still exercising every declared divergence family.
jqwik.tries.default=100
