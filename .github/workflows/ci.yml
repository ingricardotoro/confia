name: ci

# Partial and honest (design.md decision 5): only the jobs this change can leave green today.
# frontend, e2e and quality-gate arrive with changes 3 and 11 (docs/06 §14.5 declares the full
# workflow this grows into). JaCoCo (95 % line+branch on kernel) and PIT (mutation score 80 on
# kernel) run as part of `verify` since change 2, with the mutation profile selected by branch:
# main activates mutation-gate (blocks below threshold) via the same confia.ci.mainBranch
# property that already activates no-snapshots-on-main; every other branch and pull request uses
# mutation-report (never blocks, only informs) (design.md, decisions 10 and 11).

on:
  push:
    branches: [change/**, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match apps/api/pom.xml and ADR-0013, check 2.
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin

jobs:
  backend:
    name: backend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # `verify` runs, in order: maven-enforcer-plugin (Java version, dependency convergence,
      # banned dependencies, kernel purity, and — only on main, see -Dconfia.ci.mainBranch below —
      # no SNAPSHOT), compilation, unit tests (JUnit, AssertJ, jqwik), the ArchUnit + Spring
      # Modulith architecture tests under apps/api/app/src/test/java/com/confia/architecture
      # (task 2, task 3), JaCoCo coverage on kernel (95 % line+branch, always blocking), and PIT
      # mutation testing on kernel (score 80): -Dconfia.ci.mainBranch=true on main activates both
      # no-snapshots-on-main and mutation-gate (blocks below threshold) with a single property;
      # every other branch and pull request activates mutation-report instead (never blocks, only
      # informs) (design.md, decisions 10 and 11).
      - name: verify
        working-directory: apps/api
        run: ./mvnw --batch-mode verify ${{ github.ref == 'refs/heads/main' && '-Dconfia.ci.mainBranch=true' || '-Pmutation-report' }}
      - name: upload coverage and mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-reports
          path: |
            apps/api/**/target/site/jacoco/
            apps/api/**/target/pit-reports/
          retention-days: 14

  security:
    name: security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Baseline scan of the Maven dependency tree (ADR-0008, ADR-0013). pnpm and the container
      # image scan arrive with changes 3 and 11.
      - name: maven dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/api
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
