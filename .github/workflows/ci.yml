name: ci

# Partial and honest (design.md decision 5): only the jobs this change can leave green today.
# frontend arrived with change 3 (frontend-monorepo-and-contracts-pipeline); e2e and quality-gate
# arrive with change 11 (docs/06 §14.5 declares the full workflow this grows into). JaCoCo (95 % line+branch on kernel) and PIT (mutation score 80 on
# kernel) run as part of `verify` since change 2, with the mutation profile selected by branch:
# main activates mutation-gate (blocks below threshold) via the same confia.ci.mainBranch
# property that already activates no-snapshots-on-main; every other branch and pull request uses
# mutation-report (never blocks, only informs) (design.md, decisions 10 and 11).

on:
  push:
    branches: [change/**, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match apps/api/pom.xml and ADR-0013, check 2.
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin

jobs:
  backend:
    name: backend verify
    runs-on: ubuntu-latest
    # Docker is a real build dependency since jooq-flyway-testcontainers-wiring PR A1, not only a
    # test dependency: app's generate-sources phase generates jOOQ code against a temporary
    # postgres:18-alpine container before anything compiles (ADR-0015 rule 2). ubuntu-latest ships
    # Docker preinstalled, so no extra setup step is needed. Budget: the measured Testcontainers
    # *IT.java suite is well under the 8-minute limit of docs/06-estrategia-de-testing.md (PR A1:
    # 18.2s for DatabasePipelineIT, the suite's only container start; apps/api/README.md); this
    # timeout covers the whole job, including dependency downloads and every other phase.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # `verify` runs, in order: maven-enforcer-plugin (Java version, dependency convergence,
      # banned dependencies, kernel purity, and — only on main, see -Dconfia.ci.mainBranch below —
      # no SNAPSHOT), compilation, unit tests (JUnit, AssertJ, jqwik), the ArchUnit + Spring
      # Modulith architecture tests under apps/api/app/src/test/java/com/confia/architecture
      # (task 2, task 3), JaCoCo coverage on kernel (95 % line+branch, always blocking), and PIT
      # mutation testing on kernel (score 80): -Dconfia.ci.mainBranch=true on main activates both
      # no-snapshots-on-main and mutation-gate (blocks below threshold) with a single property;
      # every other branch and pull request activates mutation-report instead (never blocks, only
      # informs) (design.md, decisions 10 and 11).
      - name: verify
        working-directory: apps/api
        run: ./mvnw --batch-mode verify ${{ github.ref == 'refs/heads/main' && '-Dconfia.ci.mainBranch=true' || '-Pmutation-report' }}
      - name: upload coverage and mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-reports
          path: |
            apps/api/**/target/site/jacoco/
            apps/api/**/target/pit-reports/
            apps/api/app/target/openapi/
          retention-days: 14

  frontend:
    name: frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The TypeScript workspace (frontend-monorepo-and-contracts-pipeline, design.md decision 10). It
    # needs neither a JDK nor Docker: packages/contracts is generated from the approved snapshots in
    # apps/api/openapi/, whose agreement with the Java code the backend job proves on every run.
    # @confia/api is filtered out for the same reason: its only script delegates to ./mvnw, which
    # the backend job already runs. The Node version comes from .nvmrc and pnpm's from
    # packageManager, the one place each is declared.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --frozen-lockfile: a package.json changed without its lockfile fails here instead of being
      # rewritten. engineStrict and strictDepBuilds (pnpm-workspace.yaml) make a wrong Node version
      # or an unapproved install script fail too.
      - name: install
        run: pnpm install --frozen-lockfile
      - name: lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build --filter=!@confia/api

  security:
    name: security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Baseline scan of the Maven dependency tree (ADR-0008, ADR-0013). The container image scan
      # arrives with change 11.
      - name: maven dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/api
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      # The pnpm dependency tree (frontend-monorepo-and-contracts-pipeline, design.md decision 10;
      # probe S4). Trivy reads only the PRODUCTION dependencies of a pnpm lockfile: its
      # --include-dev-deps supports npm, yarn and gradle, not pnpm, so it sees 15 of the workspace's
      # 270 packages and none of the build tooling. It stays as a second source with its own
      # database, but the gate over the whole tree is pnpm audit below.
      - name: pnpm dependency scan (production dependencies only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Every severity, reported and never blocking, so a low or moderate finding is visible in the
      # log without failing the build (build-integrity, scenario "Solo severidad baja").
      - name: pnpm audit (report)
        continue-on-error: true
        run: pnpm audit
      # The gate: the whole pnpm tree, development tooling included, fails on high or critical.
      - name: pnpm audit (high and critical block)
        run: pnpm audit --audit-level high
