packages:
  - apps/*
  - packages/*
  - tooling

# frontend-monorepo-and-contracts-pipeline, design.md decision 6. pnpm 12 reads these settings only
# from this file: it keeps nothing but auth and registry keys from .npmrc, so an engine-strict line
# there would be ignored without a word.

# Fail the install on any Node version outside the root package.json engines range (>=24 <25).
engineStrict: true

# No dependency runs install scripts. pnpm denies them by default; strictDepBuilds turns an
# unapproved build into a failed install instead of a warning. A dependency that genuinely needs
# one is added to allowBuilds, with its reason in the pull request. (onlyBuiltDependencies, which
# the design named, was replaced by allowBuilds in pnpm 11 and has been ignored since.)
strictDepBuilds: true
allowBuilds:
  # Denied, not approved: esbuild's postinstall only double-checks the platform binary, which it
  # already receives as an optional per-platform package. An explicit false keeps strictDepBuilds
  # from failing the install while still running nothing.
  esbuild: false

# The one place each tool's version is written (task 2.1). Packages depend on "catalog:", never on
# a version of their own. TypeScript stays on 6.0.x, not 7: typescript-eslint 8.71 declares
# typescript >=4.8.4 <6.1.0.
catalog:
  "@eslint/js": 10.0.1
  "@fontsource-variable/inter": 5.3.0
  "@storybook/addon-a11y": 10.6.2
  "@storybook/react-vite": 10.6.2
  "@tailwindcss/vite": 4.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/node": 24.19.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  axe-core: 4.14.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dependency-cruiser: 18.4.0
  eslint: 10.11.0
  eslint-plugin-react-hooks: 7.1.1
  i18next: 26.4.4
  i18next-icu: 2.5.0
  intl-messageformat: 12.1.3
  jsdom: 30.1.2
  lucide-react: 1.57.0
  orval: 8.38.0
  playwright: 1.64.1
  react: 19.3.0
  react-dom: 19.3.0
  react-i18next: 17.0.16
  storybook: 10.6.2
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vite: 8.3.4
  vitest: 5.0.5
  yaml: 2.9.1
  zod: 4.6.6

# Transitive versions forced past a known vulnerability, each with its advisory. Remove an entry once
# the dependency that pulls it in ships the fixed version on its own.
overrides:
  # orval > @scalar/json-magic > undici 7.29.0: GHSA-w293-vg96-wgc3 (TLS certificate validation
  # bypass) and GHSA-rfgv-xxqx-mfg5 (denial of service), both high, both fixed in 7.29.1.
  "undici@<7.29.1": 7.30.1
  # undici 7.30.0: GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx and GHSA-qrxm-fqhp-jwvm,
  # all high, fixed in 7.30.1 (published 2026-10-15, past the two-week age rule on 2026-10-29).
  "undici@>=7.29.1 <7.30.1": 7.30.1
