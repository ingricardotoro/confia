# openspec/config.yaml
# CONFIA — SDD configuration. See openspec/project.md and docs/01-arquitectura.md
# for the full source of truth; this file only encodes machine-readable phase rules.
schema: spec-driven

context: |
  Stack: Java 25 + Spring Boot 4.1 + Maven backend (ADR-0013), jOOQ + PostgreSQL 18 (ADR-0015),
  Flyway, Spring Modulith + ArchUnit, db-scheduler (ADR-0016). Frontend: React 19 + Vite +
  TanStack (Router/Query/Table/Form), Tailwind v4, shadcn/ui, in a pnpm workspaces + Turborepo
  monorepo. Architecture: hexagonal per business capability, screaming structure,
  domain/application/infrastructure/web layering.
  Code exists since F0 change 1: Maven reactor in apps/api (kernel, app) and CI in
  .github/workflows/ci.yml. Frontend apps and packages do not exist yet.

strict_tdd: true # runner: ./mvnw verify in apps/api, JAVA_HOME must point to JDK 25

rules:
  proposal:
    - Include rollback plan for risky changes
    - Product owner approves the proposal before specs/design/tasks proceed
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (DEBE/NO DEBE, MUST/MUST NOT) consistent with existing specs
    - Business specs are written in neutral professional Spanish, matching openspec/specs/*
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale; elevate real architecture decisions to an ADR in docs/adr/
  tasks:
    - Group by phase, use hierarchical numbering
    - A change with more than 15 tasks is too large and must be split (openspec/changes/README.md)
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns and the hexagonal layering rules in docs/01-arquitectura.md
      - Money arithmetic only through com.confia.kernel.Money; business money rules live in the
        domain package of the owning module; never double/float for money
    tdd: true
    test_command: "./mvnw verify" # in apps/api, JDK 25
  verify:
    test_command: "./mvnw verify" # add -Pmutation-report to include PIT
    build_command: "./mvnw verify"
    coverage_threshold: 95 # kernel line+branch (JaCoCo); 80 global arrives with change 4
  archive:
    - Warn before merging destructive deltas
    - Merge change id as folder prefix with archive date under openspec/archive/<date>-<id>/
